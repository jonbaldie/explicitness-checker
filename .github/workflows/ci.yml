name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.0", "8.1", "8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Run PHPStan (level max, per phpstan.neon.dist)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Run PHPMD (unusedcode, codesize, design)
        run: composer phpmd

      - name: Check protected over private, and no mocks in tests
        run: composer standards

      - name: Check src for implicit inputs and outputs (default mode)
        run: composer explicitness

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.0", "8.1", "8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      # Fails below the minMsi / minCoveredMsi set in infection.json5, or if
      # any mutant is skipped for taking longer than the timeout.
      - name: Run Infection
        if: github.event_name == 'push'
        run: composer infection

      - name: Run Infection on changed PR source files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR_BASE_SHA"
          merge_base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

          if git diff --quiet --no-renames --diff-filter=AM "$merge_base" "$PR_HEAD_SHA" -- ':(glob)src/**/*.php'; then
            echo "No added or modified PHP source files since the PR merge base; skipping mutation testing."
            exit 0
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              exit "$diff_status"
            fi
          fi

          sh tools/install-infection.sh
          rm -f build/infection.json
          php tools/infection.phar --threads=max --git-diff-filter=AMR --git-diff-base="$merge_base" --ignore-msi-with-no-mutations
          php tools/check-infection-skips.php

  test:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.0", "8.1", "8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      # Fails if phpunit.xml.dist or vendor/bin/phpunit is missing, rather than
      # skipping the tests.
      - name: Run tests
        run: |
          test -f phpunit.xml.dist || { echo "phpunit.xml.dist not found"; exit 1; }
          ./vendor/bin/phpunit

